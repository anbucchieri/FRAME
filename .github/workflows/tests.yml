name: tests

# The unit suites need neither Docker nor Pinocchio: they run the whole chain with fakes.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        # The example recordings (Git LFS) are not needed by the tests.
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./frame-core
          pip install -e ./frame-kinematics --no-deps
          pip install -e ./frame-batch pytest matplotlib
      - name: Test
        run: python -m pytest frame-core frame-kinematics frame-batch -q

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-kinematics"
version = "0.1.0"
description = "Pinocchio heavy path for FRAME: IK + inverse dynamics + GRF + exo reach, producing a frame-core Capture."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "frame-core>=0.1.0",
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
]

[project.optional-dependencies]
# The heavy runtime: Pinocchio plus what utils/ (ID_Xsens, the URDF builder) imports. The Docker
# image installs Pinocchio from conda-forge instead, which is the recommended route.
ik = ["pin>=2.7", "pin-pink", "qpsolvers", "quadprog", "loop-rate-limiters", "xacro"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
